  - main [ref=e27]:
    - generic [ref=e28]:
      - img "Historische Fassade mit dem Schriftzug Bäckerei von Aug. Buschmann an der Akademiestraße in Düsseldorf, davor Gäste unter Schirmen" [ref=e30]
      - generic [ref=e31]:
        - heading [level=1] [ref=e32]:
          - text: Düsseldorfer
          - emphasis [ref=e33]: Pâtisserie.
          - text: Seit 1846.
        - paragraph [ref=e34]: In der Akademiestraße wird unter der Woche für Gastronomie, Catering und besondere Anlässe gebacken. Samstags ist von 12 bis 17 Uhr die Tür für Kaffee und Kuchen offen.
        - generic [ref=e35]:
          - generic [ref=e36]: Akademiestrasse 8, Altstadt
          - generic [ref=e37]: Samstags 12–17 Uhr
          - generic [ref=e38]: Gegr. 1846
    - generic [ref=e40]:
      - paragraph [ref=e41]: Das Haus
      - paragraph [ref=e42]: Buschmann 1846 ist eine Backstube in der Düsseldorfer Altstadt. Unter der Woche entstehen hier Kuchen, Torten und Pâtisserie für Cafés, Gastronomie, Unternehmen und private Anlässe. Ausgeliefert wird in Düsseldorf und Umgebung. Und einmal in der Woche, samstags, geht das Fenster zur Akademiestraße auf.
    - generic [ref=e44]:
      - generic [ref=e45]:
        - paragraph [ref=e46]: Geschichte
        - heading "1846 fing alles in der Akademiestraße an." [level=2] [ref=e47]
        - paragraph [ref=e48]: August Buschmann eröffnete hier seine Backstube — dieselben Räume, in denen heute wieder gebacken wird. Sechs Generationen haben den Betrieb durch zwei Weltkriege getragen, zeitweise mit rund 120 Beschäftigten und fünf Standorten in Düsseldorf.
        - paragraph [ref=e49]: Gregor Buschmann, direkter Nachfahre des Gründers, wuchs in der Altstadt auf und holte sich als Schüler der Maxschule nach dem Unterricht häufig ein Teilchen aus der Backstube. Nach Jahren als Koch, Küchenchef, Sous-Chef und Pâtissier in Düsseldorf und der Schweiz steht er seit Januar 2021 wieder dort, wo 1846 alles anfing.
      - figure "Die alte Anschlagmaschine, noch im Dienst" [ref=e50]:
        - img "Historische cremefarbene Anschlagmaschine der Marke Rego mit Schneebesen und heller Masse im Kessel" [ref=e51]
    - generic [ref=e54]:
