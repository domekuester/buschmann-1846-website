          - paragraph [ref=e68]: Bis Mitte des Jahrzehnts gehören fünf Düsseldorfer Standorte zum Unternehmen.
        - listitem [ref=e69]:
          - generic [ref=e70]: "2021"
          - paragraph [ref=e71]: Gregor Buschmann nimmt die Arbeit in der historischen Backstube wieder auf.
        - listitem [ref=e72]:
          - generic [ref=e73]: Heute
          - paragraph [ref=e74]: Unter der Woche wird produziert und ausgeliefert. Samstags gibt es Kaffee und Kuchen.
