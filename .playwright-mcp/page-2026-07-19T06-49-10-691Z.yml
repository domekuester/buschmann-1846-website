        - generic [ref=e82]:
          - paragraph [ref=e83]: "Gebacken wird, was eine Backstube mit über hundertsiebzig Jahren Übung eben backt: Käsekuchen mit Karamelldecke, Torten mit Kirschfüllung, Sahne aus dem Kupferkessel. Serviert wird samstags auf altem Porzellan — manches davon ist länger im Haus als die meisten Rezepte."
          - blockquote [ref=e84]:
            - text: „Esst mehr Sahnetorte!"
            - generic [ref=e85]: Gregor Buschmann, im Porträt von THE DORF
          - figure:
            - img "Hand über glänzender Kirschfüllung in einem Tortenrahmen"
